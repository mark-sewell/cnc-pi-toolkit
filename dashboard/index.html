<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>CNC Pi Toolkit</title>

    <link rel="stylesheet" href="style.css">
    <link
        rel="stylesheet"
        href="compact.css"
        media="(max-width: 900px) and (max-height: 600px) and (orientation: landscape)"
    >
</head>

<body>
    <main class="dashboard">
        <header class="hero">
            <img
                src="assets/logo.png"
                class="logo"
                alt="CNC Pi Toolkit logo"
            >

            <div>
                <h1>CNC Pi Toolkit</h1>
                <p>Smarter CNC control. Built on Raspberry Pi.</p>
            </div>
        </header>

        <section class="machine-card">
            <div class="machine-heading">
                <span id="status-light" class="status-light"></span>

                <div>
                    <p class="eyebrow">Machine status</p>
                    <h2 id="machine-title">Connecting…</h2>
                </div>
            </div>

            <div class="machine-details">
                <div>
                    <span>Controller</span>
                    <strong id="controller">Loading…</strong>
                </div>

                <div>
                    <span>Firmware</span>
                    <strong id="firmware">Loading…</strong>
                </div>

                <div>
                    <span>Build</span>
                    <strong id="build">Loading…</strong>
                </div>
            </div>

            <div class="coordinates">
                <div class="axis">
                    <span>X</span>
                    <strong id="x">0.000</strong>
                </div>

                <div class="axis">
                    <span>Y</span>
                    <strong id="y">0.000</strong>
                </div>

                <div class="axis">
                    <span>Z</span>
                    <strong id="z">0.000</strong>
                </div>
            </div>

            <div class="telemetry">
                <div>
                    <span>Feed</span>
                    <strong>
                        <span id="feed">0</span> mm/min
                    </strong>
                </div>

                <div>
                    <span>Spindle</span>
                    <strong>
                        <span id="spindle">0</span> RPM
                    </strong>
                </div>
            </div>
        </section>

        <section class="actions">
            <button id="control" class="primary" type="button">
                ▶ OpenBuilds CONTROL
            </button>

            <button id="diagnostics" type="button">
                🧰 Diagnostics
            </button>

            <button id="settings" type="button">
                ⚙ Settings
            </button>

            <button id="shutdown" class="danger" type="button">
                ⏻ Shutdown
            </button>
        </section>

        <footer class="status-bar">
            <span id="api-status">API: Connecting…</span>
            <span id="controller-status">GRBL: Unknown</span>
            <span id="clock">--:--</span>
        </footer>
    </main>

    <script src="app.js"></script>
</body>
</html>
