name: CNC Pi Toolkit CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  shellcheck:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . \
            -type f \
            -name "*.sh" \
            -print0 \
          | xargs -0 shellcheck

  syntax:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Bash syntax check
        run: |
          find . \
            -type f \
            -name "*.sh" \
            -exec bash -n {} \;

  formatting:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Check formatting
        run: |
          shfmt -d .

